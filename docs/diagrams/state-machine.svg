<svg width="675" height="150" viewBox="0 0 675 150" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: #ffffff;">
    <defs>
        <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
        </marker>
    </defs>
    <circle cx="20" cy="42" r="7" fill="#0f172a"/>
    <line x1="27" y1="42" x2="55" y2="42" stroke="#334155" stroke-width="1.3" marker-end="url(#sm-arrow)"/>
    <rect x="57" y="20" width="118" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="116" y="39" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">UP_TO_DATE</text>
    <text x="116" y="52" font-size="7.2" fill="#047857" text-anchor="middle">applied = latest (v1)</text>
    <rect x="245" y="14" width="185" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="337" y="31" font-size="8.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">UPDATE_AVAILABLE</text>
    <text x="337" y="44" font-size="7.2" fill="#1e40af" text-anchor="middle">Shows Net Diff (v_applied -&gt; v_latest)</text>
    <text x="337" y="56" font-size="7" fill="#3b82f6" text-anchor="middle">+ Delta (v_declined -&gt; v_latest) if declined</text>
    <rect x="515" y="20" width="145" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="587" y="38" font-size="8.5" font-weight="bold" fill="#92400e" text-anchor="middle">UPDATE_DECLINED</text>
    <text x="587" y="50" font-size="7.2" fill="#b45309" text-anchor="middle">declined=v2, applied=v1</text>
    <rect x="245" y="98" width="185" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="337" y="116" font-size="8.5" font-weight="bold" fill="#991b1b" text-anchor="middle">APPLY_IN_PROGRESS</text>
    <text x="337" y="129" font-size="7.2" fill="#b91c1c" text-anchor="middle">Concurrency Lock (~1 min file load)</text>
    <line x1="175" y1="36" x2="243" y2="36" stroke="#334155" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="209" y="31" font-size="7" fill="#334155" text-anchor="middle">Publish v2</text>
    <path d="M 405 14 C 415 1, 448 1, 430 22" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="456" y="11" font-size="6.8" fill="#1e3a8a" text-anchor="middle">Publish v3 (re-points v1-&gt;v3)</text>
    <line x1="430" y1="34" x2="513" y2="34" stroke="#334155" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="472" y="29" font-size="7" fill="#334155" text-anchor="middle">User Declines v2</text>
    <line x1="515" y1="52" x2="432" y2="52" stroke="#334155" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="472" y="63" font-size="7" fill="#b45309" text-anchor="middle">Publish v3 (v3 &gt; v2)</text>
    <line x1="310" y1="72" x2="310" y2="96" stroke="#334155" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="276" y="87" font-size="7" fill="#334155" text-anchor="middle">Click Apply</text>
    <line x1="365" y1="98" x2="365" y2="74" stroke="#dc2626" stroke-width="1.2" marker-end="url(#sm-arrow)"/>
    <text x="408" y="87" font-size="7" fill="#b91c1c" text-anchor="middle">Fail / Timeout</text>
    <path d="M 245 120 L 116 120 L 116 66" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#sm-arrow)"/>
    <text x="178" y="114" font-size="7" fill="#065f46" text-anchor="middle">UpdateApplied (applied=v3, declined=NULL)</text>
</svg>